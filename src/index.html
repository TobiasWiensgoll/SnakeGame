<!DOCTYPE html>
<html lang="de">
  <head>

      <div class="BottomButtonContainer">
        <button class="StartButton" id="startButton">

          <img class="crown2" src="/src/assets/menus/button_hauptmenue.png" />

        </div>
      </div>
      <div class="InsideContainer2">

          <div class="level level1" value="1"></div>

          <img class="backButton" id="backButton" src="/src/assets/menus/button_back.png" />
